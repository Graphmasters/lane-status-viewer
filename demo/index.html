<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lane Status Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #666;
        --bg: #fafafa;
        --card: #fff;
        --border: #e5e5e5;
        --accent: #2f6fd0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
        line-height: 1.5;
      }
      main { max-width: 820px; margin: 0 auto; padding: 24px 20px 64px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; }
      p.lead { color: var(--muted); margin-top: 0; }
      a { color: var(--accent); }
      nav.top { display: flex; gap: 16px; font-size: 0.9rem; margin-bottom: 20px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input[type="text"] {
        flex: 1 1 320px;
        min-width: 220px;
        font: 1.1rem ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 1px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
      }
      select { padding: 9px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
      .chip {
        font: 0.85rem ui-monospace, monospace;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        cursor: pointer;
        color: var(--fg);
      }
      .chip:hover { border-color: var(--accent); }
      .plate {
        margin: 18px 0 8px;
        padding: 16px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow-x: auto;
      }
      .plate svg { height: 72px; width: auto; display: block; }
      .empty { color: var(--muted); font-style: italic; }
      code.raw { font: 0.95rem ui-monospace, monospace; color: var(--muted); }
      details { margin-top: 14px; }
      summary { cursor: pointer; font-weight: 600; }
      ul.legend { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
      ul.legend li { display: flex; align-items: center; gap: 10px; }
      ul.legend svg { height: 26px; width: auto; flex: 0 0 auto; }
      p.foot { margin-top: 32px; color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <nav class="top"><strong>Lane Status Viewer</strong><a href="docs.html">Encoding &amp; keys →</a></nav>
      <h1>Lane Status Viewer</h1>
      <p class="lead">
        Render DATEX II MDM <em>Baustellen</em> lane-status strings
        (<code>laneStatusCoded</code> / <code>extendedLaneStatusCoded</code>) as a carriageway
        cross-section diagram.
      </p>

      <div class="row">
        <input id="code" type="text" spellcheck="false" autocomplete="off" placeholder="e.g. sluu2oerx" />
        <label>Language
          <select id="locale"><option value="en">EN</option><option value="de">DE</option></select>
        </label>
      </div>
      <div class="chips" id="chips"></div>

      <div class="plate" id="plate"></div>
      <div><code class="raw" id="raw"></code></div>

      <details open>
        <summary id="legendTitle">Legend</summary>
        <ul class="legend" id="legend"></ul>
      </details>

      <p class="foot">
        Encoding reference and icon attribution: <a href="docs.html">Encoding &amp; keys →</a>
      </p>
    </main>

    <script src="lane-status-viewer.global.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
